name: release

# Publishing is tag-driven and deliberate. A merge to main cannot publish: it takes someone
# cutting a `v*` tag, and then someone approving the `nuget` environment. The version comes from
# the tag rather than from the csproj, so the two cannot disagree - the csproj version is only
# the default for local `dotnet pack`.
#
# There is no stored nuget.org API key. The publish job exchanges a GitHub OIDC token for an
# API key that nuget.org issues on the spot and expires an hour later, against a trusted
# publishing policy registered on nuget.org. See README for the policy fields.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pack:
    name: build, test and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Reject a tag that is not a version before spending a build on it, and before a reviewer
      # is asked to approve something whose name does not say what it ships.
      - name: Derive the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not vMAJOR.MINOR.PATCH[-prerelease]."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --nologo

      # The gate publishes nothing that has not passed its tests. See ci.yml for why this is not
      # `dotnet test`.
      - name: Test
        run: dotnet run --project tests/MofonCode.Core.Tests --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack src/MofonCode.Core
          --configuration Release
          --nologo
          -p:Version=${{ steps.version.outputs.version }}
          --output ./artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to nuget.org
    needs: pack
    runs-on: ubuntu-latest

    permissions:
      # Lets this job ask GitHub for the OIDC token it trades for a nuget.org key. Job-level
      # permissions replace the top-level block outright, so contents is restated here.
      id-token: write
      contents: read

    # The approval gate. `nuget` carries a required reviewer, so this job waits before it runs.
    # The trusted publishing policy on nuget.org names this environment too, which means an OIDC
    # token minted by any other job in this repository will not satisfy it.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/MofonCode.Core/${{ needs.pack.outputs.version }}

    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: ./artifacts

      # Deliberately inside the gated job. A nuget.org temporary key lives one hour, and the
      # token is minted only once approval has been given - so an approval that sits overnight
      # delays the key rather than expiring it.
      - name: Exchange the OIDC token for a short-lived nuget.org key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate so re-running a release that already pushed is a no-op rather than a
      # failure. nuget.org does not allow overwriting a published version in any case. The
      # matching .snupkg alongside is picked up and pushed with it.
      - name: Push
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
